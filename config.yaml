control:
  keyboard:
    angle_step: 5
    enabled: true
    gripper_step: 10.0
    pos_step: 0.01
  pybullet:
    enabled: true
  vr:
    enabled: true
gripper:
  closed_angle: 45.0
  open_angle: 0.0
ik:
  use_reference_poses: true
  reference_poses_file: reference_poses.json
  position_error_threshold: 0.001
  hysteresis_threshold: 0.05
  movement_penalty_weight: 0.01
network:
  host_ip: 0.0.0.0
  https_port: 8443
  websocket_port: 8442
paths:
  urdf_path: URDF/SO100/so100.urdf
robot:
  left_arm:
    enabled: true
    name: Left Arm
    port: /dev/ttyACM0
  right_arm:
    enabled: false
    name: Right Arm
    port: /dev/ttySO100red
  send_interval: 0.05
  vr_to_robot_scale: 1
ssl:
  certfile: cert.pem
  keyfile: key.pem
task:
  enabled: true
  name: fiber_plug_6mm
  # Poses/offsets in the LEFT robot base frame (PyBullet Z-up, meters)
  port_position: [0.0, -0.24, 0.0]
  port_yaw_deg: 180.0
  spawn_center: [-0.10, -0.16]
  spawn_range: [0.03, 0.03]
  position_tolerance: 0.015
  angle_tolerance_deg: 35.0
  seat_depth: 0.012
  min_insert_depth: -0.01
  snap_distance: 0.04
  snap_radius: 0.02
  snap_angle_deg: 60.0
  grasp_radius: 0.06
  gripper_closed_threshold: 22.5
  grasp_local_pos: [0.0, 0.01, 0.0]
  grasp_local_rpy_deg: [0.0, 0.0, 0.0]
  latch_gripper_while_grasped: true
  guide_radius: 0.02
  guide_angle_deg: 60.0
