[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodex-teleop"
version = "0.1.0"
description = "Embodex Teleoperation Platform — Open-source XR robot teleop & embodied motion data"
authors = [
    {name = "Luis Lundgren", email = "lundgrenluis@gmail.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = ["robotics", "teleoperation", "webxr", "robot-learning", "so-100", "motion-exchange", "embodied-ai"]

dependencies = [
    "numpy",
    "scipy",
    "pybullet",
    "pynput",
    "pyyaml>=6.0",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
]

requires-python = ">=3.10"

[project.optional-dependencies]
ml = [
    "torch",
    "lerobot",
]
robot = [
    "torch",
    "lerobot[feetech]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
    "mypy",
]

[project.scripts]
embodex-teleop = "embodex.cli:main"
telegrip = "embodex.cli:main"

[project.urls]
Homepage = "https://github.com/Luis-Lundgren/embodex-teleop"
Repository = "https://github.com/Luis-Lundgren/embodex-teleop"
Issues = "https://github.com/Luis-Lundgren/embodex-teleop/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["embodex*"]