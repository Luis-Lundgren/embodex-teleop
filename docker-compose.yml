services:
  db:
    image: postgres:15-alpine
    container_name: embodex-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embodex_password}
      POSTGRES_DB: ${POSTGRES_DB:-embodex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: embodex-teleop
    restart: always
    ports:
      - "${PORT:-8500}:8000"
    environment:
      - PORT=8000
      - EMBODEX_SECURITY_MODE=${EMBODEX_SECURITY_MODE:-simulation}
      - EMBODEX_API_TOKEN=${EMBODEX_API_TOKEN:-}
      - EMBODEX_WS_TICKET_SECRET=${EMBODEX_WS_TICKET_SECRET:-}
      - EMBODEX_ALLOWED_ORIGINS=${EMBODEX_ALLOWED_ORIGINS:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - records_data:/app/records

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: embodex-teleop-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  postgres_data:
  records_data:
